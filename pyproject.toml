[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "memoq-tag-transfer"
version = "0.1.0"
description = "Transfer inline tags from source to target in memoQ mqxlz files, output TMX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "lxml>=4.9.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
memoq-tag-transfer = "tag_transfer.cli:main"
